<!DOCTYPE html>
<!--
  诅咒扫雷 · 皮肤静态预览
  本文件不接入游戏，只给同一局棋盘换五套外观，方便挑选后再合并。
  五套共用同一份棋盘数据（未翻开、数字、空地、旗、地雷、爆炸雷），
  这样差异只来自颜色、凸起和边框，不来自内容。
  打开方式：用浏览器直接打开本文件，或在项目根目录起静态服务后访问 /skin-preview.html
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>诅咒扫雷 · 五套皮肤预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* ---------- 页面本身：中性展板，不抢皮肤的颜色 ---------- */
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Nunito, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1c1917;
      background:
        radial-gradient(circle at top, #fff, transparent 42%),
        #efeae2;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 16px 72px;
    }
    .page-head h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .page-head p {
      margin: 0;
      max-width: 62ch;
      color: #57534e;
    }
    /* 跳转条自动换行，不另做一条横向滚动 */
    .jump {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 8px;
    }
    .jump a {
      text-decoration: none;
      color: #44403c;
      background: #fff;
      border: 1px solid #e7e0d6;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 14px;
    }
    .jump a:hover { border-color: #a8a29e; }

    .card {
      display: grid;
      grid-template-columns: minmax(200px, 240px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-top: 28px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #e7e0d6;
      border-radius: 24px;
    }
    .meta .idx {
      display: inline-block;
      font-family: "Share Tech Mono", Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #78716c;
    }
    .meta h2 {
      margin: 4px 0 8px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }
    .meta p { margin: 0 0 10px; color: #44403c; }
    .meta .id {
      font-family: "Share Tech Mono", Consolas, monospace;
      font-size: 13px;
      color: #78716c;
    }
    @media (max-width: 800px) {
      .card { grid-template-columns: 1fr; }
    }

    /* ---------- 所有皮肤共用的布局，尺寸对齐游戏顶栏 + 9×9 棋盘 ---------- */
    .stage {
      position: relative;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px 18px 22px;
      border-radius: 28px;
    }
    .decor {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
    }
    .content { position: relative; z-index: 1; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .wordmark {
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .tools { display: flex; gap: 8px; }
    .tool {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: grid;
      place-items: center;
    }
    .tool svg { width: 18px; height: 18px; }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 84px;
      padding: 8px 10px;
      margin-bottom: 16px;
    }
    .counter {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 10px;
      width: fit-content;
    }
    .counter.right { margin-left: auto; }
    .counter svg { width: 22px; height: 22px; flex: none; }
    /* 顶栏里的雷和格子里的雷共用同一个 SVG。格子用 cqi，这里改回固定像素。 */
    .counter svg.mark { width: 22px; height: 22px; flex: none; }
    .digits {
      font-family: "Share Tech Mono", Consolas, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .face {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      padding: 8px;
    }
    .face svg { width: 100%; height: 100%; }

    /* 棋盘用 9 列等分，格子随舞台变宽，避免再套一层滚动 */
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      container-type: inline-size;
    }
    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      min-width: 0;
      position: relative;
    }
    .n {
      font-weight: 800;
      font-size: 18px;
      font-size: 5.4cqi;
      line-height: 1;
    }
    .mark { width: 6.2cqi; height: 6.2cqi; }
    .mark.bomb { width: 6.8cqi; height: 6.8cqi; }

    /* ===================== 01 经典灰盒 =====================
       未翻开：白边 + 深灰边的凸起方块。
       已翻开：同一灰色但四边都是细线，看起来被按平。
       计数器做成黑底红字，爆炸雷是纯红格。 */
    .t-classic {
      background: #c0c0c0;
      border-radius: 0;
      padding: 0 12px 14px;
      border-style: solid;
      border-width: 3px;
      border-color: #ffffff #808080 #808080 #ffffff;
    }
    .t-classic .topbar {
      margin: 0 -12px 12px;
      padding: 7px 10px;
      background: linear-gradient(90deg, #000080, #1084d0);
    }
    .t-classic .wordmark {
      color: #fff;
      font-family: Tahoma, "Segoe UI", sans-serif;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .t-classic .tool {
      width: 22px;
      height: 18px;
      border-radius: 0;
      background: #c0c0c0;
      color: #111;
      border-style: solid;
      border-width: 2px;
      border-color: #fff #808080 #808080 #fff;
    }
    .t-classic .hud {
      background: #c0c0c0;
      border-radius: 0;
      border-style: solid;
      border-width: 3px;
      border-color: #808080 #fff #fff #808080;
      box-shadow: none;
    }
    .t-classic .counter {
      background: #000;
      border-radius: 0;
      padding: 4px 8px;
      min-width: 92px;
    }
    .t-classic .counter svg { color: #ff0000; }
    .t-classic .digits { color: #ff0000; text-shadow: 0 0 6px rgba(255, 0, 0, 0.45); }
    .t-classic .face {
      width: 52px;
      height: 52px;
      border-radius: 0;
      background: #c0c0c0;
      border-style: solid;
      border-width: 3px;
      border-color: #fff #808080 #808080 #fff;
    }
    .t-classic .board {
      gap: 0;
      padding: 4px;
      background: #c0c0c0;
      border-radius: 0;
      border-style: solid;
      border-width: 3px;
      border-color: #808080 #fff #fff #808080;
    }
    .t-classic .cell { border-radius: 0; }
    .t-classic .cell.hidden {
      background: #c0c0c0;
      border-style: solid;
      border-width: 3px;
      border-color: #ffffff #808080 #808080 #ffffff;
    }
    .t-classic .cell.open {
      background: #bdbdbd;
      border: 1px solid #7a7a7a;
    }
    .t-classic .cell.exploded { background: #ff0000; border-color: #ff0000; }
    .t-classic .cell.exploded .mark { color: #fff; }
    .t-classic .cell.mine .mark { color: #111; }
    .t-classic .cell.hidden .mark { color: #ff0000; }
    .t-classic .n1 { color: #0000ff; }
    .t-classic .n2 { color: #008000; }
    .t-classic .n3 { color: #ff0000; }
    .t-classic .n4 { color: #000080; }
    .t-classic .n5 { color: #800000; }
    .t-classic .n6 { color: #008080; }
    .t-classic .n7 { color: #000; }
    .t-classic .n8 { color: #808080; }

    /* ===================== 02 深渊符文 =====================
       未翻开：暗紫石，顶上一条冷高光，底下一条近黑边，像嵌进祭坛。
       已翻开：焦褐岩面，数字用高亮色才能在暗底上读清。 */
    .t-abyss {
      background: radial-gradient(circle at 50% 0%, #3b1764 0%, #140a1c 46%, #07060b 100%);
      color: #f5f3ff;
    }
    .t-abyss .decor::before,
    .t-abyss .decor::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
    }
    .t-abyss .decor::before {
      width: 220px; height: 220px; left: -40px; top: 80px;
      background: rgba(147, 51, 234, 0.28);
    }
    .t-abyss .decor::after {
      width: 180px; height: 180px; right: -30px; bottom: 40px;
      background: rgba(190, 18, 60, 0.22);
    }
    .t-abyss .wordmark {
      background: linear-gradient(90deg, #e879f9, #fb7185);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .t-abyss .tool {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(216, 180, 254, 0.28);
      color: #e9d5ff;
    }
    .t-abyss .hud {
      background: rgba(8, 4, 16, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
    }
    .t-abyss .counter {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
    }
    .t-abyss .counter.mines { border: 1px solid rgba(127, 29, 29, 0.65); color: #fca5a5; }
    .t-abyss .counter.prayer { border: 1px solid rgba(120, 53, 15, 0.7); color: #fcd34d; }
    .t-abyss .face {
      background: linear-gradient(#4c1d95, #1e1b4b);
      border: 1px solid #6d28d9;
      box-shadow: 0 8px 0 #12081c;
      color: #ddd6fe;
    }
    .t-abyss .board {
      gap: 2px;
      padding: 10px;
      background: #14081f;
      border: 3px solid #3b0764;
      border-radius: 14px;
    }
    .t-abyss .cell { border-radius: 6px; }
    .t-abyss .cell.hidden.a { background: #3b2463; }
    .t-abyss .cell.hidden.b { background: #301c56; }
    .t-abyss .cell.hidden {
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.16), inset 0 -4px 0 #14081f;
    }
    .t-abyss .cell.open.a { background: #5c4034; }
    .t-abyss .cell.open.b { background: #4e362c; }
    .t-abyss .cell.mine { background: #4c1d95; }
    .t-abyss .cell.mine .mark { color: #fae8ff; }
    .t-abyss .cell.exploded { background: #ef4444; }
    .t-abyss .cell.exploded .mark { color: #fff; }
    .t-abyss .cell.hidden .mark { color: #fb7185; }
    .t-abyss .n1 { color: #7dd3fc; }
    .t-abyss .n2 { color: #86efac; }
    .t-abyss .n3 { color: #fca5a5; }
    .t-abyss .n4 { color: #d8b4fe; }
    .t-abyss .n5 { color: #fdba74; }
    .t-abyss .n6 { color: #67e8f9; }
    .t-abyss .n7 { color: #fef3c7; }
    .t-abyss .n8 { color: #e9d5ff; }

    /* ===================== 03 樱庭和纸 =====================
       未翻开：抹茶砖，浅高光、深绿底边。
       已翻开：暖白和纸。旗是朱红色。整体偏亮，适合和现在的黑夜界面拉开。 */
    .t-sakura {
      background: linear-gradient(180deg, #fff8f4 0%, #fde8ef 100%);
    }
    .t-sakura .petal {
      position: absolute;
      width: 18px;
      height: 12px;
      border-radius: 80% 0 80% 0;
      background: #f9a8d4;
      opacity: 0.55;
    }
    .t-sakura .p1 { left: 8%; top: 18%; transform: rotate(20deg); }
    .t-sakura .p2 { left: 22%; top: 46%; transform: rotate(-30deg); opacity: 0.35; }
    .t-sakura .p3 { right: 10%; top: 12%; transform: rotate(40deg); }
    .t-sakura .p4 { right: 18%; top: 58%; transform: rotate(-15deg); opacity: 0.4; }
    .t-sakura .p5 { left: 46%; bottom: 8%; transform: rotate(10deg); opacity: 0.3; }
    .t-sakura .p6 { right: 36%; bottom: 16%; transform: rotate(-40deg); }
    .t-sakura .wordmark { color: #9f1239; }
    .t-sakura .tool {
      background: #fff;
      border: 1px solid #fecdd3;
      color: #be123c;
    }
    .t-sakura .tool.gear { color: #78716c; }
    .t-sakura .hud {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #fecdd3;
      border-radius: 22px;
      box-shadow: 0 10px 28px rgba(157, 23, 77, 0.08);
    }
    .t-sakura .counter { border-radius: 14px; }
    .t-sakura .counter.mines {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #e11d48;
    }
    .t-sakura .counter.prayer {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #b45309;
    }
    .t-sakura .face {
      background: #fff;
      border: 1px solid #fecdd3;
      box-shadow: 0 8px 0 #fbcfe8;
      color: #fb7185;
    }
    .t-sakura .board {
      gap: 4px;
      padding: 10px;
      background: #f3c3d0;
      border-radius: 18px;
    }
    .t-sakura .cell { border-radius: 8px; }
    .t-sakura .cell.hidden.a { background: #8fbf90; }
    .t-sakura .cell.hidden.b { background: #7eb382; }
    .t-sakura .cell.hidden {
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -4px 0 #4d7c54;
    }
    .t-sakura .cell.open.a { background: #fffaf3; }
    .t-sakura .cell.open.b { background: #f4eadc; }
    .t-sakura .cell.mine { background: #fffaf3; }
    .t-sakura .cell.mine .mark { color: #292524; }
    .t-sakura .cell.exploded { background: #fb7185; }
    .t-sakura .cell.exploded .mark { color: #fff; }
    .t-sakura .cell.hidden .mark { color: #dc2626; }
    .t-sakura .n1 { color: #1d4ed8; }
    .t-sakura .n2 { color: #15803d; }
    .t-sakura .n3 { color: #dc2626; }
    .t-sakura .n4 { color: #6d28d9; }
    .t-sakura .n5 { color: #9a3412; }
    .t-sakura .n6 { color: #0f766e; }
    .t-sakura .n7 { color: #1c1917; }
    .t-sakura .n8 { color: #57534e; }

    /* ===================== 04 霓虹街机 =====================
       未翻开：暗玻璃，底边一条青色光。
       已翻开：更暗的凹槽，数字用荧光色。背景有细网格，不额外做滚动层。 */
    .t-neon {
      background: #070b14;
      color: #e2e8f0;
    }
    .t-neon .decor {
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .t-neon .wordmark {
      background: linear-gradient(90deg, #22d3ee, #e879f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.35));
    }
    .t-neon .tool {
      background: transparent;
      border: 1px solid #155e75;
      color: #67e8f9;
    }
    .t-neon .hud {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(34, 211, 238, 0.35);
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
    }
    .t-neon .counter { background: rgba(0, 0, 0, 0.35); border-radius: 10px; }
    .t-neon .counter.mines { color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.35); }
    .t-neon .counter.prayer { color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); }
    .t-neon .face {
      background: #0b1220;
      border: 1px solid #22d3ee;
      border-radius: 14px;
      box-shadow: 0 6px 0 #042f2e, 0 0 16px rgba(34, 211, 238, 0.35);
      color: #a5f3fc;
    }
    .t-neon .board {
      gap: 3px;
      padding: 10px;
      background: #050814;
      border: 2px solid rgba(34, 211, 238, 0.4);
      border-radius: 12px;
    }
    .t-neon .cell { border-radius: 4px; }
    .t-neon .cell.hidden.a { background: #102033; }
    .t-neon .cell.hidden.b { background: #0c1a2c; }
    .t-neon .cell.hidden {
      box-shadow: inset 0 1px 0 rgba(103, 232, 249, 0.35), inset 0 -3px 0 rgba(34, 211, 238, 0.55);
    }
    .t-neon .cell.open.a { background: #0a1018; }
    .t-neon .cell.open.b { background: #080d14; }
    .t-neon .cell.open { box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.16); }
    .t-neon .cell.mine { background: #3b0764; box-shadow: none; }
    .t-neon .cell.mine .mark { color: #f0abfc; }
    .t-neon .cell.exploded { background: #be123c; box-shadow: none; }
    .t-neon .cell.exploded .mark { color: #fff; }
    .t-neon .cell.hidden .mark { color: #f472b6; }
    .t-neon .n1 { color: #22d3ee; }
    .t-neon .n2 { color: #4ade80; }
    .t-neon .n3 { color: #fb7185; }
    .t-neon .n4 { color: #c4b5fd; }
    .t-neon .n5 { color: #fbbf24; }
    .t-neon .n6 { color: #2dd4bf; }
    .t-neon .n7 { color: #f8fafc; }
    .t-neon .n8 { color: #94a3b8; }

    /* ===================== 05 古庙石砖 =====================
       未翻开：石灰岩斜面，顶缘亮、底缘褐，砖缝是深色灰浆。
       已翻开：被铲平的浅沙，数字用矿物色深字。 */
    .t-stone {
      background: radial-gradient(circle at 50% 30%, #4a3b28 0%, #241c14 72%);
      color: #f5ead2;
    }
    .t-stone .decor {
      background: radial-gradient(circle at 50% 40%, transparent 40%, rgba(0, 0, 0, 0.35) 100%);
    }
    .t-stone .wordmark {
      font-family: Palatino, "Palatino Linotype", "Songti SC", serif;
      color: #e7c27a;
      letter-spacing: 0.08em;
      font-size: 22px;
    }
    .t-stone .tool {
      background: #3a3126;
      border: 1px solid #6b5a42;
      color: #e7c27a;
    }
    .t-stone .hud {
      background: #3a3126;
      border: 2px solid #6b5a42;
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .t-stone .counter { border-radius: 10px; background: #241c14; }
    .t-stone .counter.mines { color: #f0a8a0; border: 1px solid #5c3a36; }
    .t-stone .counter.prayer { color: #f6d48a; border: 1px solid #6b5428; }
    .t-stone .face {
      background: linear-gradient(#6d5c46, #4a3f32);
      border: 1px solid #8a7352;
      box-shadow: 0 8px 0 #241c14;
      color: #f3e6c8;
    }
    .t-stone .board {
      gap: 3px;
      padding: 10px;
      background: #5c4632;
      border-radius: 8px;
      box-shadow: inset 0 0 0 3px #3a3024, inset 0 0 0 5px #6b5a42;
    }
    .t-stone .cell { border-radius: 3px; }
    .t-stone .cell.hidden.a {
      background: linear-gradient(155deg, #f0e2cb 0%, #d5c0a0 42%, #b89b74 100%);
    }
    .t-stone .cell.hidden.b {
      background: linear-gradient(155deg, #e6d5b8 0%, #c9b08a 46%, #a88b66 100%);
    }
    .t-stone .cell.hidden {
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.65), inset 0 -4px 0 #7c6548;
    }
    .t-stone .cell.open.a { background: #ead9bc; }
    .t-stone .cell.open.b { background: #e0cca8; }
    .t-stone .cell.mine { background: #6b4f3a; }
    .t-stone .cell.mine .mark { color: #1c1917; }
    .t-stone .cell.exploded { background: #b91c1c; }
    .t-stone .cell.exploded .mark { color: #fff; }
    .t-stone .cell.hidden .mark { color: #b91c1c; }
    .t-stone .n1 { color: #1e3a8a; }
    .t-stone .n2 { color: #166534; }
    .t-stone .n3 { color: #9f1239; }
    .t-stone .n4 { color: #5b21b6; }
    .t-stone .n5 { color: #9a3412; }
    .t-stone .n6 { color: #115e59; }
    .t-stone .n7 { color: #292524; }
    .t-stone .n8 { color: #57534e; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>五套皮肤预览</h1>
      <p>下面是同一局棋盘的五种画法。标题、雷数、笑脸、祈祷次数和格子内容都一样，只换外观。现有游戏是深色底加绿草地，不在这五套里。看中哪套，把编号发我即可。</p>
      <nav class="jump">
        <a href="#classic">01 经典灰盒</a>
        <a href="#abyss">02 深渊符文</a>
        <a href="#sakura">03 樱庭和纸</a>
        <a href="#neon">04 霓虹街机</a>
        <a href="#stone">05 古庙石砖</a>
      </nav>
    </header>
    <main id="gallery"></main>
  </div>

  <script>
    // 棋盘字符含义：H 未翻开，F 旗，0 翻开空地，1-8 数字，M 翻开的雷，X 爆炸的雷。
    // 五行皮肤读的是同一份字符串，避免某一套“看起来更好”只是因为摆盘不同。
    var BOARD = [
      "HHHHFHHHH",
      "H112HH11H",
      "H10111101",
      "H20000101",
      "F1011210H",
      "H101X2M1H",
      "H1012211H",
      "H211HHHHH",
      "HHHHHHHHH"
    ];

    var THEMES = [
      {
        id: "classic",
        idx: "01",
        name: "经典灰盒",
        blurb: "白边凸起、按下变平、黑底红字。数字对比最接近传统扫雷，读起来最省力。"
      },
      {
        id: "abyss",
        idx: "02",
        name: "深渊符文",
        blurb: "暗紫石板盖住格子，翻开是焦褐色。光从边缘来，诅咒感比现在的草地更重。"
      },
      {
        id: "sakura",
        idx: "03",
        name: "樱庭和纸",
        blurb: "抹茶砖盖住，翻开是暖白和纸，旗子用朱红。整屏偏亮，和现在的黑夜界面差得最远。"
      },
      {
        id: "neon",
        idx: "04",
        name: "霓虹街机",
        blurb: "暗玻璃格子，底边一条青光，数字是荧光色。适合黑底下玩，格子边界靠光而不是靠土色。"
      },
      {
        id: "stone",
        idx: "05",
        name: "古庙石砖",
        blurb: "石灰岩斜面当盖子，翻开变成浅沙，砖缝是深色灰浆。数字用蓝、绿、朱砂这类矿物色。"
      }
    ];

    /** 书本图标：对应游戏里的记录按钮 */
    function iconBook() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A3 3 0 0 1 7 4h13v16H7a3 3 0 0 0-3 3z"/><path d="M4 19.5A3 3 0 0 1 7 17h13"/></svg>';
    }

    /** 齿轮图标：对应游戏里的设置按钮 */
    function iconGear() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.5 1.5M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>';
    }

    /** 雷：圆身 + 引线。颜色由格子的 currentColor 决定 */
    function iconBomb() {
      return '<svg class="mark bomb" viewBox="0 0 24 24"><circle cx="12" cy="13.6" r="6" fill="currentColor"/><rect x="10.7" y="6.4" width="2.6" height="2.2" rx="0.4" fill="currentColor"/><path d="M14.4 7.2c1.5-1.4 2.5-1.4 3.3-2.1" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/><circle cx="18.1" cy="4.3" r="1.25" fill="#fbbf24"/></svg>';
    }

    /** 旗：杆和旗面同一颜色，小尺寸下更易辨认 */
    function iconFlag() {
      return '<svg class="mark" viewBox="0 0 24 24"><path d="M8 21V3.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8 4.2h10.2L15.4 8.2 18.2 12H8z" fill="currentColor"/></svg>';
    }

    /** 顶栏中央的脸。经典皮肤用黄脸，其余皮肤用描边脸，跟各自的按钮颜色走 */
    function iconFace(themeId) {
      if (themeId === "classic") {
        return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffd54a" stroke="#111" stroke-width="1.4"/><circle cx="9" cy="10" r="1.1" fill="#111"/><circle cx="15" cy="10" r="1.1" fill="#111"/><path d="M8.2 14.2c1.1 1.6 2.4 2.3 3.8 2.3s2.7-.7 3.8-2.3" stroke="#111" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
      }
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M9 15.5h6" stroke-linecap="round"/></svg>';
    }

    /** 祈祷：两只相对的手，对应右侧祈祷计数 */
    function iconHands() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9.2 20V8.2c0-1.8 1-3.2 2-3.2.5 0 .8.3.8.8V13"/><path d="M14.8 20V8.2c0-1.8-1-3.2-2-3.2-.5 0-.8.3-.8.8V13"/><path d="M7.5 20h9"/></svg>';
    }

    /**
     * 把一个字符画成一格。
     * even 用来做棋盘深浅交错：(行 + 列) 为偶数时加 class a。
     */
    function renderCell(code, even) {
      var tone = even ? "a" : "b";
      if (code === "H" || code === "F") {
        return '<div class="cell hidden ' + tone + '">' + (code === "F" ? iconFlag() : "") + "</div>";
      }
      if (code === "M") {
        return '<div class="cell open mine">' + iconBomb() + "</div>";
      }
      if (code === "X") {
        return '<div class="cell open exploded">' + iconBomb() + "</div>";
      }
      var n = Number(code);
      var label = n > 0 ? '<span class="n n' + n + '">' + n + "</span>" : "";
      return '<div class="cell open ' + tone + '">' + label + "</div>";
    }

    function renderBoard() {
      var html = "";
      for (var r = 0; r < BOARD.length; r++) {
        for (var c = 0; c < BOARD[r].length; c++) {
          html += renderCell(BOARD[r].charAt(c), (r + c) % 2 === 0);
        }
      }
      return html;
    }

    /** 樱花只是装饰点，不占布局高度，装饰层本身裁切，页面仍只有一根滚动条 */
    function renderDecor(themeId) {
      if (themeId !== "sakura") return '<div class="decor"></div>';
      var petals = "";
      for (var i = 1; i <= 6; i++) petals += '<i class="petal p' + i + '"></i>';
      return '<div class="decor">' + petals + "</div>";
    }

    function renderStage(theme) {
      return ''
        + '<div class="stage t-' + theme.id + '">'
        + renderDecor(theme.id)
        + '<div class="content">'
        + '<div class="topbar"><div class="wordmark">CURSED MINES</div><div class="tools"><span class="tool">' + iconBook() + '</span><span class="tool gear">' + iconGear() + "</span></div></div>"
        + '<div class="hud">'
        + '<div class="counter mines">' + iconBomb() + '<span class="digits">12</span></div>'
        + '<div class="face">' + iconFace(theme.id) + "</div>"
        + '<div class="counter prayer right">' + iconHands() + '<span class="digits">3</span></div>'
        + "</div>"
        + '<div class="board">' + renderBoard() + "</div>"
        + "</div></div>";
    }

    var gallery = document.getElementById("gallery");
    gallery.innerHTML = THEMES.map(function (theme) {
      return ''
        + '<section class="card" id="' + theme.id + '">'
        + '<div class="meta"><div class="idx">' + theme.idx + '</div><h2>' + theme.name + "</h2><p>" + theme.blurb + '</p><div class="id">' + theme.id + "</div></div>"
        + renderStage(theme)
        + "</section>";
    }).join("");
  </script>
</body>
</html>
