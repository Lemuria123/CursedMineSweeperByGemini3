# 本地用 Docker 管这套开发进程。
# 宿主机已占用 5173 / 8080 / 8081，前端用 38000。
# 38001、38002 当前空闲，继续用它们：前端 utils/api.ts 写死了 http://localhost:38001。
# 加密密钥与 start-dev-server.bat 里的本地开发密钥相同，并传给 Vite，保证提交成绩能解密。

name: cursed-minesweeper

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "38001:38001"
      - "38002:38002"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin}
      GAME_API_PORT: "38001"
      ADMIN_PORT: "38002"
    volumes:
      # 直接使用当前仓库，数据库和图标仍写在宿主机上
      - .:/app
      - cms_server_node_modules:/app/server/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "38000:38000"
    environment:
      # 与 server 的 ENCRYPTION_KEY 保持同一把本地开发密钥
      VITE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # Windows 绑定挂载下 Vite 需要轮询才能看到文件变化
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - cms_web_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cms_server_node_modules:
  cms_web_node_modules:
